name: limitless_cloud
description: Limitless Cloud - Telegram-powered cloud storage with Google Drive UX
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Database (replaces Firebase - no config file needed)
  sqflite: ^2.3.3+1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # File Handling
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  path: ^1.9.0

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0

  # Storage / Cache
  shared_preferences: ^2.3.2

  # Secure hardware-encrypted storage (Android Keystore) for session token
  flutter_secure_storage: ^9.2.2


  # Networking
  http: ^1.2.2
  http_parser: ^4.0.2
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  mime: ^1.0.6
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Animations
  flutter_animate: ^4.5.0

  # Progress notifications for uploads/downloads (keeps process alive in background)
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/


